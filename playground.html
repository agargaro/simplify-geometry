<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@three.ez/simplify-geometry playground</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      user-select: none;
    }

    #error-popup {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      box-sizing: border-box;
      width: min(560px, calc(100% - 32px));
      max-height: 50%;
      overflow: auto;
      padding: 12px 16px;
      border: 1px solid #e5484d;
      border-radius: 6px;
      background: #2a1215;
      color: #ffdcdc;
      font: 13px/1.5 ui-monospace, monospace;
    }

    #error-popup[hidden] {
      display: none;
    }

    #error-popup header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #ff8a8f;
      font-weight: bold;
    }

    #error-popup button {
      border: 1px solid #e5484d;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    #error-message {
      margin: 8px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #error-stack {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div id="error-popup" role="alert" hidden>
    <header>
      <span>Error</span>
      <button id="error-close" type="button">Close</button>
    </header>
    <p id="error-message"></p>
    <details>
      <summary>Stack trace</summary>
      <pre id="error-stack"></pre>
    </details>
  </div>
  <script type="module" src="./examples/Playground.ts"></script>
</body>

</html>
